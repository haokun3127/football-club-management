# Standalone file: never merge with the root production compose or its overrides.
name: cq-talent-nonproduction
services:
  data-init:
    image: ${FCM_NONPROD_IMAGE:?Set an immutable image tag built from the reviewed commit}
    user: "0:0"
    command: ["sh", "-c", "chown node:node /var/lib/cq-talent-develop /var/lib/cq-talent-trial"]
    volumes:
      - develop-data:/var/lib/cq-talent-develop
      - trial-data:/var/lib/cq-talent-trial
    restart: "no"
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: ["no-new-privileges:true"]
  develop:
    image: ${FCM_NONPROD_IMAGE:?Set an immutable image tag built from the reviewed commit}
    env_file: ${FCM_DEVELOP_ENV_FILE:?Set a dedicated private develop env file}
    environment:
      NODE_ENV: production
      FCM_RUNTIME_ENV: develop
      DATABASE_URL: /var/lib/cq-talent-develop/api.sqlite
      HOST: 0.0.0.0
      PORT: 3000
      FCM_CQ_TALENT_ACCEPTANCE_SEED: "0"
    ports: ["127.0.0.1:3101:3000"]
    volumes: ["develop-data:/var/lib/cq-talent-develop"]
    depends_on:
      data-init:
        condition: service_completed_successfully
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  trial:
    image: ${FCM_NONPROD_IMAGE:?Set an immutable image tag built from the reviewed commit}
    env_file: ${FCM_TRIAL_ENV_FILE:?Set a dedicated private trial env file}
    environment:
      NODE_ENV: production
      FCM_RUNTIME_ENV: trial
      DATABASE_URL: /var/lib/cq-talent-trial/api.sqlite
      HOST: 0.0.0.0
      PORT: 3000
      FCM_CQ_TALENT_ACCEPTANCE_SEED: "0"
    ports: ["127.0.0.1:3102:3000"]
    volumes: ["trial-data:/var/lib/cq-talent-trial"]
    depends_on:
      data-init:
        condition: service_completed_successfully
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
volumes:
  develop-data:
    name: cq-talent-develop-data
  trial-data:
    name: cq-talent-trial-data
