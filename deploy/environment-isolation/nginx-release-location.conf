# Include ONLY inside the existing production location / block.
# Nginx `if` is deliberately limited to return; no rewrite/upstream selection.
if ($fcm_release_request_invalid) { return 403; }
proxy_set_header X-User-Id "";
proxy_set_header X-MiniProgram-Env $http_x_miniprogram_env;
proxy_set_header Referer $http_referer;
