# Candidate locations inside the existing cqtc.pomi.tech HTTPS server block.
# Review the actual server config first. This file is not installed by this task.
# Fixed upstreams: never derive an upstream from a request header or URL variable.
location = /__env/develop { return 404; }
location = /__env/trial { return 404; }
location ^~ /__env/develop/ {
    proxy_pass http://127.0.0.1:3101/;
    proxy_set_header Host $host;
    proxy_set_header X-User-Id "";
    proxy_set_header Referer $http_referer;
    proxy_set_header X-MiniProgram-Env $http_x_miniprogram_env;
    proxy_intercept_errors off;
}
location ^~ /__env/trial/ {
    proxy_pass http://127.0.0.1:3102/;
    proxy_set_header Host $host;
    proxy_set_header X-User-Id "";
    proxy_set_header Referer $http_referer;
    proxy_set_header X-MiniProgram-Env $http_x_miniprogram_env;
    proxy_intercept_errors off;
}
# Includes unknown environments. Do not fall through to the release location.
location ^~ /__env { return 404; }
# Existing release location / keeps upstream 127.0.0.1:3000.
# Preserve Referer and X-MiniProgram-Env unchanged there too; never inject release.
# Do not add error_page redirects/fallbacks from nonproduction locations to /.
