# Include in the http context, before the cqtc.pomi.tech server block.
# Protect the legacy production process without opening or migrating its database.
map $http_x_miniprogram_env $fcm_release_header_invalid {
    default 1;
    "" 0;
    release 0;
}

map $http_referer $fcm_release_referer_valid {
    default 0;
    ~^https://servicewechat\.com/wx4c588cd106e520e0/[1-9][0-9]*/page-frame\.html$ 1;
}

map $http_referer $fcm_nonproduction_referer {
    default 0;
    ~^https://servicewechat\.com/[^/]+/(0|devtools)/page-frame\.html$ 1;
}

map $uri $fcm_release_app_client {
    default 0;
    ~^/clubs/[^/]+/app-clients/ 1;
}

map "$fcm_release_app_client:$fcm_release_referer_valid" $fcm_release_client_invalid {
    default 0;
    "1:0" 1;
}

map "$fcm_release_header_invalid:$fcm_nonproduction_referer:$fcm_release_client_invalid" $fcm_release_request_invalid {
    default 1;
    "0:0:0" 0;
}
