services:
  data-init:
    build:
      context: .
      dockerfile: Dockerfile
    image: cq-talent-api:latest
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /var/lib/cq-talent && find /var/lib/cq-talent -path /var/lib/cq-talent/secure-backups -prune -o -exec chown node:node {} +"]
    volumes:
      - cq-talent-api-data:/var/lib/cq-talent
    networks:
      - cq-talent-api-net
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: cq-talent-api:latest
    container_name: cq-talent-api
    restart: unless-stopped
    depends_on:
      data-init:
        condition: service_completed_successfully
    env_file:
      - .env.runtime
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: /var/lib/cq-talent/api.sqlite
      FCM_CQ_TALENT_ACCEPTANCE_SEED: "1"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - cq-talent-api-data:/var/lib/cq-talent
    networks:
      - cq-talent-api-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  cq-talent-api-net:
    name: cq-talent-api-net

volumes:
  cq-talent-api-data:
    name: cq-talent-api-data
