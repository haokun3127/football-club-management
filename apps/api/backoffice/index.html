<!doctype html>
<html lang="zh-CN" data-environment="{{ENVIRONMENT}}">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>天才足球 · 俱乐部管理工作台</title>
  <link rel="stylesheet" href="assets/style.css"><script type="module" src="assets/app.js"></script>
</head>
<body>
  <main id="login" class="login-page">
    <section class="brand-panel"><div><h1>天才足球</h1><p class="brand-line">让每一次训练<br>成为看得见的成长</p><p>俱乐部管理平台</p></div></section>
    <section class="login-panel"><form id="login-form">
      <p class="environment" id="login-environment"></p><h2>登录工作台</h2><p class="muted">使用俱乐部授权账号</p>
      <label class="field">账号<input name="username" autocomplete="username" required minlength="3" maxlength="64" placeholder="请输入账号"></label>
      <label class="field">密码<input name="password" type="password" autocomplete="current-password" required maxlength="128" placeholder="请输入密码"></label>
      <p id="login-error" class="error" role="alert"></p>
      <button class="primary" id="login-submit" type="submit">登录工作台</button>
      <p class="help">忘记登录方式？联系俱乐部管理员</p>
    </form></section>
  </main>
  <div id="workspace" class="workspace" hidden>
    <aside><div class="wordmark">天才足球</div><p class="caption">TALENT FOOTBALL</p><p class="muted caption">俱乐部管理工作台</p><nav aria-label="主导航"><a class="nav active" href="./" aria-current="page">数据管理</a></nav></aside>
    <div class="workspace-body"><header><span>天才足球 / 数据管理</span><div><span id="environment" class="environment"></span><span id="identity"></span><button id="logout" class="text-button" type="button">退出登录</button></div></header>
      <main class="content"><h1>数据管理</h1><p class="muted">人员与队伍 · 课程与活动</p>
        <div class="catalog-layout"><nav id="tables" aria-label="业务数据表">
          <button type="button" data-table="students" class="active">学员档案</button><button type="button" data-table="scouts">球探人员</button><button type="button" data-table="teams">队伍</button><button type="button" data-table="coaches">教练</button><button type="button" data-table="events">课程与活动</button>
        </nav><section class="table-card" aria-labelledby="table-title"><div class="table-heading"><h2 id="table-title">学员档案</h2><form id="search-form"><input id="search" aria-label="搜索当前数据表" placeholder="搜索当前数据表" maxlength="60"><button type="submit">搜索</button></form></div>
          <p id="table-error" class="error" role="alert"></p><div class="table-scroll"><table><thead id="table-head"></thead><tbody id="table-body"></tbody></table></div>
          <div class="pagination"><span id="total" role="status"></span><div><button id="previous" type="button">上一页</button><button id="next" type="button">下一页</button><button id="refresh" type="button">刷新</button></div></div>
        </section></div>
      </main>
    </div>
  </div>
  <noscript>请启用 JavaScript 后登录工作台。</noscript>
</body></html>
